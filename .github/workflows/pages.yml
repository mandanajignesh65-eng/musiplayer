# Publishes the app/ folder to GitHub Pages whenever it changes on main.
# config.js is not in git; it is written here from the repository secrets GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET.
name: Publish app
on:
  push:
    branches: [main]
    paths: [app/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write config.js
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          printf "export const CLIENT_ID = '%s';\nexport const CLIENT_SECRET = '%s';\n" "$CLIENT_ID" "$CLIENT_SECRET" > app/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
